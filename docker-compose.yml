services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: indoor_player
      MYSQL_USER: indoor_user
      MYSQL_PASSWORD: indoor_password

    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
